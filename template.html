<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1613">
<title>{{name}} · {{band}}</title>
<meta name="description" content="{{name}} על הבמה – להקת {{band}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{name}} · להקת {{band}}">
<meta property="og:description" content="צפו ב{{firstName}} על הבמה">
{{ogImage}}
<link rel="preload" as="image" href="../images/{{photo}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* אותה שפה עיצובית כמו הטפסים והצעת המחיר של אהבתיה:
   נייר שנהב, דיו חם, הכתום הרך של הלב בלוגו, וכתב Rubik דק.
   תמונות וסרטונים נשארים כהים עם כיתוב לבן מעליהם. */
:root{
  --bg:#FBF7F1;
  --surface:#FFFDF9;
  --ink:#2B2520;
  --mute:rgba(43,37,32,.68);
  --line:rgba(43,37,32,.13);
  --line-2:rgba(43,37,32,.24);
  --amber:#F6A860;        /* מילוי, מסגרות וכיתוב מעל תמונות */
  --amber-text:#B0601C;   /* אותו כתום, כהה מספיק לקריאה על הנייר */
  --amber-ink:#2B2520;
  --shade:26,22,19;       /* כמעט-שחור חם, לצעיף שמעל התמונות */
  --display:"Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r-lg:24px;
  --r:18px;
  --gutter:20px;
  --ease:cubic-bezier(.2,.75,.25,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:env(safe-area-inset-bottom);
}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- פתיחה ---------- */
.hero{position:relative;isolation:isolate;min-height:84svh;display:flex;align-items:flex-end;overflow:hidden;color:#fff}
.hero-img{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{
  content:"";position:absolute;z-index:-1;inset:0;
  background:linear-gradient(180deg,
    rgba(var(--shade),.3) 0%,rgba(var(--shade),.05) 26%,rgba(var(--shade),.62) 58%,
    rgba(var(--shade),.78) 84%,var(--bg) 100%);
}
.hero-text{width:100%;padding:0 var(--gutter) clamp(84px,14svh,128px)}
.brand{display:block;height:34px;width:auto;margin:0 0 14px;filter:drop-shadow(0 1px 8px rgba(var(--shade),.5))}
h1{
  margin:0;font-family:var(--display);font-weight:300;line-height:1.02;
  font-size:clamp(54px,16vw,104px);letter-spacing:-.01em;text-wrap:balance;
  text-shadow:0 2px 24px rgba(var(--shade),.5);
}
.tagline{margin:14px 0 0;font-size:18px;color:rgba(255,255,255,.9);max-width:34ch;text-wrap:pretty}
.scroll-cue{
  display:inline-flex;align-items:center;gap:10px;margin-top:22px;min-height:48px;
  font-size:16px;font-weight:400;letter-spacing:.04em;text-decoration:none;color:#fff;
  border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:10px 22px;
  background:rgba(var(--shade),.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.scroll-cue svg{width:16px;height:16px;color:var(--amber)}

/* ---------- אזורים ---------- */
section{padding-block:8px 56px}
h2{
  margin:0 0 22px;font-family:var(--display);font-weight:300;
  font-size:clamp(30px,8vw,46px);line-height:1.12;letter-spacing:-.005em;text-wrap:balance;
}
h2 em{font-style:normal;color:var(--amber-text)}

/* ---------- סרטונים ---------- */
.featured-wrap{display:flex;justify-content:center;margin-bottom:12px}
.videos{
  display:flex;align-items:flex-start;gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);
  margin-inline:calc(var(--gutter) * -1);padding:0 var(--gutter) 28px;
  scrollbar-width:none;
}
.videos::-webkit-scrollbar{display:none}
.video{
  position:relative;flex:none;width:42vw;max-width:190px;aspect-ratio:9/16;
  scroll-snap-align:start;border:0;padding:0;margin:0;cursor:pointer;
  background:#1A1613;border-radius:var(--r);overflow:hidden;isolation:isolate;
  color:#fff;font:inherit;text-align:start;
  box-shadow:0 18px 30px -22px rgba(var(--shade),.6);
  -webkit-tap-highlight-color:transparent;
}
.video.wide{width:80vw;max-width:420px;aspect-ratio:16/9}
.video.featured{
  width:100%;max-width:calc(78svh * 9 / 16);border-radius:var(--r-lg);
  box-shadow:0 30px 60px -32px rgba(var(--shade),.6);
}
.video.featured.wide{max-width:none}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,transform .8s var(--ease)}
.video.ready img{opacity:1}
.video::after{
  content:"";position:absolute;z-index:1;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--shade),0) 50%,rgba(var(--shade),.8) 100%);
}
.play{
  position:absolute;z-index:2;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  background:rgba(var(--shade),.45);border:1.5px solid rgba(247,248,252,.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .3s var(--ease),background-color .3s,border-color .3s,color .3s;
}
.play svg{width:18px;height:18px;margin-inline-start:-3px}
.video.featured .play{width:76px;height:76px}
.video.featured .play svg{width:26px;height:26px;margin-inline-start:-4px}
@media (hover:hover){
  .video:hover img{transform:scale(1.03)}
  .video:hover .play{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
}
.video:focus-visible .play{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.video-title{
  position:absolute;z-index:2;inset-inline:14px;bottom:12px;
  font-size:15px;font-weight:500;line-height:1.3;
}
.video.featured .video-title{inset-inline:20px;bottom:16px;font-size:17px;font-weight:600}

/* ---------- עליו ---------- */
.about p{margin:0;font-size:18px;color:var(--mute);max-width:46ch;white-space:pre-line;text-wrap:pretty}

/* ---------- המלצות ---------- */
.quotes{display:grid;gap:12px}
.quote{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.quote p{margin:0 0 10px;font-size:18px;font-weight:300}
.quote footer{font-size:15px;color:var(--mute)}

/* ---------- סיום ---------- */
.foot{margin:0;padding:8px var(--gutter) 40px;display:flex;justify-content:center}
.foot img{height:78px;width:auto}

/* ---------- נגן ---------- */
dialog.player{
  border:0;padding:0;background:transparent;color:#fff;
  max-width:none;max-height:none;width:100vw;height:100dvh;overflow:hidden;
}
dialog.player::backdrop{background:rgba(var(--shade),.94)}
.player-inner{width:100%;height:100%;display:grid;place-items:center;padding:56px 12px 20px}
.frame{
  position:relative;width:min(100%,calc((100dvh - 76px) * 9 / 16));aspect-ratio:9/16;
  background:#000;border-radius:14px;overflow:hidden;
}
dialog.player.wide .frame{width:min(100%,1100px,calc((100dvh - 76px) * 16 / 9));aspect-ratio:16/9}
.frame::before{
  content:"";position:absolute;inset:0;margin:auto;width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);border-top-color:var(--amber);animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.frame iframe,.frame video{position:relative;width:100%;height:100%;border:0;display:block}
.frame video{object-fit:contain;background:#000}
.close{
  position:absolute;top:10px;inset-inline-start:12px;width:40px;height:40px;border-radius:50%;
  border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;
}
.close svg{width:18px;height:18px}

/* ---------- מסכים רחבים ---------- */
@media (min-width:860px){
  :root{--gutter:40px}
  .hero{
    min-height:0;align-items:center;gap:56px;color:var(--ink);overflow:visible;
    max-width:1120px;margin-inline:auto;padding:56px var(--gutter) 64px;
  }
  .hero::after{display:none}
  .hero-img{
    position:static;flex:none;width:400px;height:auto;aspect-ratio:2/3;border-radius:var(--r-lg);
    box-shadow:0 30px 60px -32px rgba(var(--shade),.6);
  }
  .hero-text{padding:0}
  .brand{height:44px;margin-bottom:18px;filter:brightness(0);opacity:.82}
  h1{font-size:clamp(72px,9vw,120px);text-shadow:none}
  .tagline{font-size:20px;color:var(--mute)}
  .scroll-cue{color:var(--ink);border-color:var(--line-2);background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .scroll-cue svg{color:var(--amber-text)}
  .featured-wrap{margin-bottom:16px}
  .videos{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;
    overflow:visible;margin-inline:0;padding:0 0 12px;
  }
  .video,.video.wide{width:auto;max-width:none}
  .video.wide{grid-column:span 2}
  .video.featured{width:100%;max-width:400px}
  .video.featured.wide{max-width:860px}
  .quotes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .video img,.play{transition:none}
}
</style>
</head>
<body>

<header class="hero">
  <img class="hero-img" src="../images/{{photo}}" alt="{{name}} שר על הבמה" style="object-position:{{photoFocus}}" fetchpriority="high">
  <div class="hero-text">
    <img class="brand" src="../images/logo-white.png" alt="להקת {{band}}" width="720" height="184">
    <h1>{{name}}</h1>
    {{tagline}}
    <a class="scroll-cue" href="#videos">
      לסרטונים של {{firstName}}
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v12M3 9l5 5 5-5"/></svg>
    </a>
  </div>
</header>

<main>
  <section id="videos" class="wrap">
    <h2>{{firstName}} <em>על הבמה</em></h2>
{{featured}}
{{videos}}
  </section>
{{about}}
{{testimonials}}
</main>

<p class="foot"><img src="../images/logo-dark.png" alt="להקת {{band}}" width="640" height="496" loading="lazy"></p>

<dialog class="player" aria-label="נגן וידאו">
  <button class="close" type="button" aria-label="סגירה">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
  </button>
  <div class="player-inner"><div class="frame"></div></div>
</dialog>

<script>
(function(){
  // התאמת הכרטיס לסרטון: אנכי או רוחבי, לפי התמונה הממוזערת
  document.querySelectorAll('.video img').forEach(function(img){
    var card = img.closest('.video');
    function done(){
      if (img.naturalWidth > img.naturalHeight) card.classList.add('wide');
      card.classList.add('ready');
    }
    if (img.complete && img.naturalWidth) done();
    else {
      img.addEventListener('load', done);
      img.addEventListener('error', function(){ img.remove(); });
    }
  });

  // נגן: הסרטון נטען רק כשלוחצים עליו, כדי שהעמוד ייפתח מהר
  var dlg = document.querySelector('dialog.player');
  var frame = dlg.querySelector('.frame');
  function close(){ if (dlg.open) dlg.close(); }
  document.querySelectorAll('.video').forEach(function(card){
    card.addEventListener('click', function(){
      dlg.classList.toggle('wide', card.classList.contains('wide'));
      var f;
      if (card.dataset.kind === 'video') {
        f = document.createElement('video');
        f.controls = true; f.autoplay = true; f.playsInline = true;
        f.setAttribute('playsinline', '');
        var poster = card.querySelector('img');
        if (poster) f.poster = poster.currentSrc || poster.src;
        f.src = card.dataset.src;
      } else {
        f = document.createElement('iframe');
        f.src = card.dataset.src;
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.allowFullscreen = true;
      }
      f.title = card.getAttribute('aria-label');
      frame.replaceChildren(f);
      dlg.showModal();
      if (f.play) { var p = f.play(); if (p && p.catch) p.catch(function(){}); }
    });
  });
  dlg.querySelector('.close').addEventListener('click', close);
  dlg.addEventListener('click', function(e){
    if (e.target === dlg || e.target.classList.contains('player-inner')) close();
  });
  dlg.addEventListener('close', function(){ frame.replaceChildren(); });
})();
</script>
</body>
</html>
